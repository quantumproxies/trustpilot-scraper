[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-trustpilot-scraper"
version = "0.1.0"
description = "Trustpilot scraper for Python and the command line: public reviews of any company by its domain, with rating, title, text, dates, verification label, reviewer country and the company reply, plus TrustScore and review count, as JSON or CSV. Free and open source; sign in with your QuanticData account, no proxies or headless browser to run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["trustpilot", "trustpilot-scraper", "trustpilot-api", "trustpilot-reviews", "review-scraper", "reviews-scraper", "customer-reviews", "review-monitoring", "reputation-management", "sentiment-analysis", "web-scraping", "scraper"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
trustpilot-scraper = "quanticdata_trustpilot_scraper.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/trustpilot-scraper-api/?utm_source=github&utm_medium=pypi&utm_campaign=trustpilot-scraper"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/trustpilot-scraper"
Issues = "https://github.com/quantumproxies/trustpilot-scraper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_trustpilot_scraper" = ["spec.json", "py.typed"]
